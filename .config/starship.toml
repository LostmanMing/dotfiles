# starship 提示符配置（bash/zsh 共用）
# 文档：https://starship.rs/config/
# 风格：两行式、简洁字符风（无 powerline 色块）
#
# 配色使用标准 One Dark palette。所有模块只引用 palette 里的 red/yellow/green/blue/purple/cyan/gray，
# 不再使用自定义 EVA 色值。
# 信息段一律不 bold——bold 只留给输入符和 root 警示；早先各段用 ANSI 命名色时，
# "bold + 基础 ANSI 色" 在多数终端会被渲染成亮色变体（输出 1;32m 这类），整行偏亮。
# 现在全部是真彩色十六进制，颜色由配置决定，不受终端调色板影响。

# 提示符前不插空行。starship 默认 add_newline = true 会在每次提示符前多打一个空行，
# 屏幕上每条命令之间都夹一行空白，翻历史时有效行数被砍掉近一半。
add_newline = false

palette = "onedark"

# 扫描当前目录判断该启用哪些模块的超时。默认 30ms，抬到 100ms 给慢文件系统
# （网络挂载 / virtiofs）多点余量：目录里文件多时 30ms 可能扫不完，导致某些
# 按扩展名触发的模块偶发不显示。100ms 仍远低于人能感知的卡顿。
scan_timeout = 100

# 外部命令超时（主要卡在 git 扫状态）。用 starship 默认的 500ms。
# 注意：这台机器够快没问题，但某台 virtiofs 机器实测 `git status`（已加
# ignore_submodules）是 0.659s > 500ms——那台上 git 状态段会超时、可能刷
# "git timed out"。真要在慢机器上稳住就把这里抬回 1000。
# 抬高只是让 starship 多等，不会让命令变快，设太长反而让提示符明显卡顿；
# 根本的降耗手段是下面不求值语言版本模块 + git_status 不遍历子模块。
command_timeout = 500

# 第一行：SSH 主机标识 + 目录 + git + 命令耗时；第二行：输入符
# 注意：format/add_newline/palette 都是根级键，必须写在任何 [表头] 之前，
# 否则会被 TOML 解析进上一个表（曾把 format 放到 [palettes.onedark] 之后，
# 结果变成 palettes.onedark.format，根级 format 丢失、starship 回落默认格式）。
#
# 不放语言版本模块（$c $cmake $python $lua $nodejs $rust）：它们每画一次提示符
# 就要 fork 一次外部进程跑 <tool> --version。在慢机器上（网络挂载的工作区、
# 容器负载）单次会超过默认 command_timeout 500ms，刷出成片的
# "Executing command timed out" 警告。而版本号是装饰性信息——nvim 里已有 LSP
# 和 statusline，终端提示符里显示 cmake 版本号的用途接近于零，延迟却是每次
# 回车都要付的。模块只要不出现在 format 里，starship 就完全不会求值，
# 比逐个 disabled = true 更彻底。要恢复就把 $c$cmake$python$lua$nodejs$rust
# 加回下面这行，并补上对应的 [c] [cmake] … 段（见 git 历史）。
#
# $git_state 的位置对齐 starship 默认 $all 的顺序（branch → state → status），
# 放在 branch 之后、status 之前，读起来是"哪个分支、正在做什么、有什么改动"。
# $status 放第二行开头，紧贴输入符，失败码就在你下一条命令的正上方。
#
# 布局：第一行全部左对齐，身份/目录/git/耗时顺序显示；第二行是输入符。
format = """
$username$directory$git_branch$git_state$git_status$cmd_duration
$status$character"""

# One Dark 配色。
[palettes.onedark]
red = "#e06c75"
yellow = "#e5c07b"
green = "#98c379"
blue = "#61afef"
purple = "#c678dd"
cyan = "#56b6c2"
gray = "#abb2bf"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# ── 主机标识：仅显示用户名，不显示 @host ──
[username]
format = "[$user]($style) "
style_user = "gray"
style_root = "bold red"        # root 保留 bold：需要一眼看出是特权账户
show_always = false           # 本地普通用户不显示（root/SSH 时显示）

[hostname]
ssh_only = true               # 只在 SSH 会话显示
format = "[$hostname]($style) "
style = "gray"

# ── 目录 ──
[directory]
truncation_length = 4          # 最多显示 4 层
truncate_to_repo = true        # git 仓库里从仓库根开始
style = "blue"                   # One Dark 蓝色，突出当前目录
# 前缀文件夹图标 （nf-fa-folder），只读目录追加锁 󰌾（nf-md-lock，取自预设）。
# 都是 Nerd Font 私用区字符，改这行同样别被工具/粘贴吃掉。
format = "[ ]($style)[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "red"

# ── git ──
# symbol 里那个字符是 U+E0A0（Nerd Font / Powerline 的分支图标），不是普通空格。
# 曾经丢成 symbol = " "（引号里只剩一个 ASCII 空格），提示符上就只剩 "on   main"
# 的空隙、没有图标——查 git 历史最近 8 个 commit 都是坏的。改这行时注意别被
# 编辑器或复制粘贴吃掉这个私用区字符，校验：
#   grep -A1 '^\[git_branch\]' starship.toml | grep symbol | od -c   → 应有 356 202 240
[git_branch]
symbol = " "   # U+E0A0，校验方法见上面注释
style = "purple"               # One Dark 紫色

# ── git 中间状态：rebase / merge / cherry-pick / bisect / revert ──
# 默认就启用，之前只是没写进 format，所以 rebase 中断时提示符毫无表示。
# 零成本：读 .git 下的状态文件，不 fork 进程。
# 和下面 git_status 同用 One Dark 黄色。
# 共用不影响辨认——git_state 是 (REBASING 2/5) 圆括号，git_status 是图标+计数，
# 靠结构而不是颜色区分，且 git_state 平时根本不出现。
[git_state]
style = "yellow"

[git_status]
# 默认把所有改动挤成一个 [!]/[?]，看不出是哪类。这里按类别给不同图标+颜色，
# 每类只在计数 >0 时出现（$count 由 starship 填），语义色沿用全局约定：
#   绿=已暂存(好了)  黄=改过/重命名(待处理)  灰=未跟踪  红=删除/冲突(危险)
#   紫=stash  领先/落后箭头用灰(信息性)。图标是 Nerd Font 私用区，勿被工具吃掉。
# 每个键自带 [..](色)，不靠外层 style 统一上色；format 里 [...] 只是分组、不出字面括号。
format = "([$conflicted$staged$modified$renamed$deleted$untracked$stashed$ahead_behind]($style) )"
style = "gray"
staged     = "[ $count](green)"
modified   = "[ $count](yellow)"
renamed    = "[»$count](yellow)"
untracked  = "[ $count](gray)"
deleted    = "[✘$count](red)"
conflicted = "[=$count](red)"
stashed    = "[≡$count](purple)"
ahead      = "⇡$count"
behind     = "⇣$count"
diverged   = "⇕⇡$ahead_count⇣$behind_count"
# 不遍历子模块：慢文件系统上这一项就是大头。某台 virtiofs 机器实测
# `git status` 2.235s，加 `--ignore-submodules=all` 降到 0.659s——子模块占 71%，
# 超过 command_timeout 后 starship 会刷出成片的 "git timed out" 警告。
# 代价：子模块里有未提交改动时，提示符不再标记出来（父仓库自身的改动照常显示）。
ignore_submodules = true

# ── 命令耗时：超过 2s 才显示 ──
[cmd_duration]
min_time = 2000
style = "gray"                 # 次要信息，用 One Dark 前景灰
# 默认 format 是 "took [$duration]"，把英文 took 换成沙漏图标 （nf-fa-hourglass-half）
format = " [$duration]($style) "

# ── 上一条命令的退出码 ──
# 这个模块默认 disabled = true，必须显式打开（光加进 format 不够）。
# 之前只有 [character] 的箭头变红，能看出"错了"但看不出错在哪；退出码能区分
# 127 命令不存在 / 130 Ctrl+C / 137 被 OOM kill / 1 普通失败。
# success_symbol 默认为空，所以成功时这一段完全不占位，不会挤到输入符。
# 符号用 ✘ 而不是默认的 ❌ emoji：这套提示符是纯字符风，emoji 宽度还依赖终端。
# 不 bold，遵循本文件的约定（bold 只留给输入符和 root 警示）。
[status]
disabled = false
symbol = "✘ "
style = "red"
