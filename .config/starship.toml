# starship 提示符配置（bash/zsh 共用）
# 文档：https://starship.rs/config/
# 风格：两行式、简洁字符风（无 powerline 色块）
#
# 配色对齐 nvim 的 onedarkpro。原先各段用 ANSI 命名色（green/cyan/yellow…），
# 而 "bold + 基础 ANSI 色" 在多数终端会被渲染成亮色变体（输出是 1;32m 这类），
# 整行因此偏亮。改用真彩色十六进制后颜色由配置决定，不再受终端调色板影响。
# 同时去掉信息段的 bold——onedark 在编辑器里也是常规字重渲染这些颜色的；
# bold 只留给输入符和 root 警示。

add_newline = true   # 命令之间空一行

palette = "onedark"

# 外部命令超时。默认 500ms 在慢机器上偶发不够（git 扫大仓库状态时会抖一下），
# 小幅抬到 1000 吸收抖动。不抬更高：抬高只是让 starship 等更久，不会让命令变快，
# 超时设太长反而让提示符明显卡顿。真正的降耗手段是下面不求值语言版本模块。
command_timeout = 1000

# 第一行：SSH 主机标识 + 目录 + git + 命令耗时；第二行：输入符
# 注意：format/add_newline/palette 都是根级键，必须写在任何 [表头] 之前，
# 否则会被 TOML 解析进上一个表（曾把 format 放到 [palettes.onedark] 之后，
# 结果变成 palettes.onedark.format，根级 format 丢失、starship 回落默认格式）。
#
# 不放语言版本模块（$c $cmake $python $lua $nodejs $rust）：它们每画一次提示符
# 就要 fork 一次外部进程跑 <tool> --version。在慢机器上（网络挂载的工作区、
# 容器负载）单次会超过默认 command_timeout 500ms，刷出成片的
# "Executing command timed out" 警告。而版本号是装饰性信息——nvim 里已有 LSP
# 和 statusline，终端提示符里显示 cmake 版本号的用途接近于零，延迟却是每次
# 回车都要付的。模块只要不出现在 format 里，starship 就完全不会求值，
# 比逐个 disabled = true 更彻底。要恢复就把 $c$cmake$python$lua$nodejs$rust
# 加回下面这行，并补上对应的 [c] [cmake] … 段（见 git 历史）。
format = """
$username$hostname$directory$git_branch$git_status$cmd_duration
$character"""

# 色值取自 onedarkpro 的实际高亮组。名字沿用 ANSI 色名以覆盖标准色，
# 这样下面各段的 style 写法基本不用动。
# eva_purple 是 lualine 里 git 分支用的初号机紫，让提示符和状态栏一致。
[palettes.onedark]
red = "#e06c75"
yellow = "#e5c07b"
green = "#98c379"
cyan = "#56b6c2"
blue = "#61afef"
purple = "#c678dd"
gray = "#7f848e"               # onedark 的注释色，给次要信息用
eva_purple = "#9888d1"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# ── 主机标识：仅 SSH 连接时显示 user@host，区分本地/远程 ──
[username]
format = "[$user]($style)[@](dim)"
style_user = "yellow"
style_root = "bold red"        # root 保留 bold：需要一眼看出是特权账户
show_always = false           # 本地普通用户不显示（root/SSH 时显示）

[hostname]
ssh_only = true               # 只在 SSH 会话显示
format = "[$hostname]($style) "
style = "yellow"

# ── 目录 ──
[directory]
truncation_length = 4          # 最多显示 4 层
truncate_to_repo = true        # git 仓库里从仓库根开始
style = "cyan"

# ── git ──
[git_branch]
symbol = " "
style = "eva_purple"           # 与 lualine 状态栏的分支色一致

[git_status]
style = "yellow"
# 不遍历子模块：慢文件系统上这一项就是大头。某台 virtiofs 机器实测
# `git status` 2.235s，加 `--ignore-submodules=all` 降到 0.659s——子模块占 71%，
# 超过 command_timeout 后 starship 会刷出成片的 "git timed out" 警告。
# 代价：子模块里有未提交改动时，提示符不再标记出来（父仓库自身的改动照常显示）。
ignore_submodules = true

# ── 命令耗时：超过 2s 才显示 ──
[cmd_duration]
min_time = 2000
style = "gray"                 # 次要信息，用注释色让它退到背景
