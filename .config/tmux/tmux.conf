# Tmux Config — LostmanMing

# --- Clipboard Detection (run once at startup) ---
# 探到就用它当 copy-pipe 的目标。这条路和 set-clipboard on 的 OSC 52 是**并行**的，
# 两条都会走，谁通算谁的：
#   - 终端支持 OSC 52（iTerm2/WezTerm/kitty/...）→ OSC 52 那条生效
#   - 终端不支持，但开了 SSH X11 转发且本地跑着 XQuartz/VcXsrv → xclip 这条生效
# 曾经把这段删掉，理由是「OSC 52 够了、xclip 多余」，结果那台终端不认 OSC 52 的
# 机器直接复制不出来了（它一直靠 X11 转发 + xclip）。**不要再删。**
# 也不要按 SSH 排除：远程恰恰是最需要这条兜底的场景。
# 代价为零：实测 copy-pipe 即使管道命令失败，tmux buffer 照样被填、也照样留在 copy-mode。
run-shell 'tmux set -gu @clipboard_cmd; \
if command -v pbcopy >/dev/null 2>&1; then tmux set -g @clipboard_cmd pbcopy; \
elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then tmux set -g @clipboard_cmd wl-copy; \
elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then tmux set -g @clipboard_cmd "xclip -selection clipboard"; \
elif command -v clip.exe >/dev/null 2>&1; then tmux set -g @clipboard_cmd clip.exe; fi'

# --- Basic ---
set -g mouse on                    # 鼠标支持
set -s escape-time 0               # 按键响应更快
# set -g passthrough on              # 放行 sixel 等图形到终端（已注释，next-3.8 不支持）
set -g set-clipboard on              # 剪贴板互通的枢纽，别改成 external，理由见 Copy Mode 一节
set -g focus-events on             # 焦点事件
set -g history-limit 10000         # 回滚行数
set -g base-index 1                # 窗口编号从 1 开始
setw -g pane-base-index 1          # 面板编号从 1 开始
set -g renumber-windows on         # 关闭窗口后重新编号
setw -g aggressive-resize on       # 多客户端连接时按"窗口"取最小尺寸，而非整个 session

# prefix + R 一键重载配置
bind R source-file ~/.config/tmux/tmux.conf \; display "配置已重载"

# --- Terminal ---
# default-terminal 用 tmux-256color 而非 xterm-256color：它的 terminfo 里有 Smulx
# （undercurl，nvim 诊断波浪线要用）和斜体，OSC 52 用的 Ms 两者都有。
# 老系统可能没这个 terminfo 条目，探到再用。
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "xterm-256color"'

# 声明**外层**终端的能力。必须先 -gu 再 -as：
#   -as 是追加，每次 prefix+R / tmux source 都再加一份，实测不加 -gu 连按两次就攒到 5 条；
#   -gu 恢复 tmux 自带默认（xterm*:clipboard:ccolour:cstyle:focus:title 和 screen*:title
#   要留着，clipboard 就是 OSC 52 外发所需），再追加我们的，重复 source 也只有一份。
#   RGB      truecolor，取代老式的 `set -ga terminal-overrides ",xterm*:Tc"`
#   usstyle  undercurl / 下划线着色
set -gu terminal-features
set -as terminal-features ",xterm*:RGB:usstyle,screen*:RGB,tmux*:RGB,alacritty*:RGB:usstyle,wezterm*:RGB:usstyle,foot*:RGB:usstyle,kitty*:RGB:usstyle"
# terminal-overrides 已不需要（Tc 被上面的 RGB 取代）。这行同时清掉长期运行的 server 里
# 历史 `set -ga` 攒下的十几份 xterm*:Tc；用 -u 而不是设空串，保留各版本自带的默认项
# （如 next-3.8 的 linux*:AX@）。
set -gu terminal-overrides

# --- Pane Navigation (vim-style) ---
bind h select-pane -L               # 左边面板
bind j select-pane -D               # 下面面板
bind k select-pane -U               # 上面面板
bind l select-pane -R               # 右边面板

# --- Splits (对齐 nvim: \ 垂直, - 水平) ---
bind \\ split-window -h -c "#{pane_current_path}"   # 垂直分屏
bind - split-window -v -c "#{pane_current_path}"    # 水平分屏

# --- Window Management ---
bind t new-window -c "#{pane_current_path}"   # 新建窗口（t=terminal）
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# --- Copy Mode (vi 风格) ---
setw -g mode-keys vi

bind Escape copy-mode                  # 进入复制模式
bind Enter copy-mode                   # 进入复制模式

# 退出复制模式
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi a send -X cancel
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi Enter send -X cancel

# vim 风格选择
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
# --- 复制 ---
#
# 剪贴板互通全靠 OSC 52，tmux buffer 当中转站：
#
#     nvim yank ──OSC52──┐
#                        ├─→ tmux 截获入 buffer ──OSC52 转发──→ 本地机器剪贴板
#     这里按 y ──────────┘         │
#                                  └──→ nvim 的 p 读 `tmux save-buffer -`
#
# **set-clipboard 必须是 on**：实测 `external` 只把内层程序的 OSC 52 透传给外层终端、
# 不写进 tmux 自己的 buffer，于是 nvim 里 yank 的东西 prefix+P 粘不到，
# nvim ↔ tmux 这条腿直接断掉。
#
# 反方向（本地复制 → 远程粘贴）只能靠终端的 Cmd+V：shell 和 nvim 插入模式都行，
# 但 normal 模式的 p 拿不到——那需要 OSC 52 **读**，绝大多数终端出于安全默认拒绝。
#
# 用 copy-selection 而非 copy-selection-and-cancel：后者复制完立刻退出 copy-mode、
# 视口跳回底部，翻了半天才找到的位置就没了。copy-selection 复制并清掉选区但
# **留在 copy-mode**，滚动位置不变，可以接着选下一段；
# 什么时候回终端由上面的 a/i/q/Esc/Enter 自己决定。
#
# 有剪贴板命令就 copy-pipe，没有就 copy-selection。两者都填 tmux buffer、都留在
# copy-mode、都触发 set-clipboard on 的 OSC 52 外发；copy-pipe 只是**额外**再写一份
# 到本地剪贴板工具，给终端不认 OSC 52 的机器兜底（见文件开头的探测说明）。
bind -T copy-mode-vi y if -F '#{@clipboard_cmd}' \
    'send-keys -X copy-pipe "#{@clipboard_cmd}"' \
    'send-keys -X copy-selection'

# 粘贴
bind P paste-buffer
bind -T copy-mode-vi p paste-buffer \; send -X cancel

# --- Session ---
bind S command-prompt -p "Session name:" "new-session -s '%%'"   # 新建 session
bind N switch-client -n                 # 下一个 session
bind . command-prompt -I "#S" "rename-session '%%'"   # 重命名 session

# --- Status Bar ---
set -g status on
# 相对整条状态栏绝对居中，不受左侧路径和右侧 AI 计数长度变化影响
set -g status-justify absolute-centre
set -g status-left-length 50
set -g status-right-length 60
set -g status-interval 2         # AI 状态指示要够快；实测聚合脚本 ~6ms，2s 约占单核 0.3%/客户端
                                # 不降到 1：减少计数变化带来的状态栏重绘

# 配色（AtomOneDark）：蓝 #61afef，暗黄 #e5c07b，背景 #21252b，灰 #abb2bf
set -g status-left "#{?client_prefix,#[fg=#e5c07b]#[bold]PREFIX,#[fg=#61afef]#[bold]#{?#{!=:#{client_key_table},root},#{client_key_table}, #S}}#[fg=#5c6370] ⟩ #(~/.config/tmux/scripts/path-tail.sh '#{pane_current_path}') #[default]"
# status-right：AI 状态汇总（所有 session）+ 时钟
# 聚合器输出形如 ⚑2 ✦1 ✓3，没有 AI pane 时输出空串（退回只有时钟的样子）。
# 放在时钟左边：时钟因此钉在最右，计数变宽时不会左右跳。
# 直接调脚本、不要写成 #(sh .../ai-status.sh)：本机 /bin/sh 是 dash，而脚本用了
# bash 数组，用 sh 调会直接语法错误退出、状态栏静默空白（踩过）。脚本入库为 100755。
set -g status-right "#(~/.config/tmux/scripts/ai-status.sh)#[fg=#abb2bf] %H:%M "
set -g status-style "bg=#21252b,fg=#abb2bf"

setw -g window-status-separator " "
# 窗口名后缀追加 AI 状态图标：⚑黄=等你确认  ✦蓝=思考中  ✓绿=已完成
# （黄与 status-left 的 PREFIX 指示同色，但两者分处状态栏两端，不会混淆）
# 字形选择踩过两个坑，别乱换：
#   1. 三个都必须是 East Asian Width = N（中性）。原来用的 ◇ U+25C7 是 A（歧义宽），
#      CJK 字体常画成双宽，而 tmux 按 wcwidth 只预留一格 → 顶出矩形边缘。
#   2. 不要换成 ✔ U+2714「粗对勾」：它有 emoji 变体（✔️），很多字体走 emoji 字体
#      回退画成双宽，会把后面的字挡掉（实测）。✓ U+2713 无 emoji 变体，是纯文本字形。
# 图标后那一格空格必须在 #[default] 之前——它要继承矩形背景，给字形留收口缓冲。
# 放后缀而非前缀：上面两个 format 只设了 fg、没重置 bg/属性，前缀会把样式泄漏进窗口名；
# 后缀之后只有 window-status-separator，泄漏不可见。
# 条件内的样式必须拆成 #[fg=X]#[bold]——带逗号的 #[fg=X,bold] 会被格式引擎截断（实测）。
# 状态读的是 @ai_state（pane 作用域选项，由 scripts/ai-status.sh 每 status-interval 写入），
# 不是 pane_title：标题是 CLI 自己的地盘，Claude 运行时会不停改写，我们插手就会互相
# 覆盖、图标每 2 秒闪一次（踩过）。代价是图标最多滞后一个 status-interval。
# @ai_state 写在 pane 上，但在 window 作用域会解析到**活动 pane**：分屏且 AI pane
# 非活动时这里不显示，那种情况由 status-right 的全局计数兜住。
setw -g window-status-format "#[fg=#5c6370] #{window_index} #W#{?#{==:wait,#{@ai_state}}, #[fg=#e5c07b]#[bold]⚑,#{?#{==:busy,#{@ai_state}}, #[fg=#61afef]✦,#{?#{==:idle,#{@ai_state}}, #[fg=#98c379]✓,}}} #[default]"
setw -g window-status-current-format "#[bg=#3e4451,fg=#61afef,bold] #{window_index} #[fg=#abb2bf]#W#{?#{==:wait,#{@ai_state}}, #[fg=#e5c07b]#[bold]⚑,#{?#{==:busy,#{@ai_state}}, #[fg=#61afef]✦,#{?#{==:idle,#{@ai_state}}, #[fg=#98c379]✓,}}} #[default]"

# --- prefix+w / prefix+s 的会话·窗口选择器，行首带 AI 状态图标 ---
# 这两个键原来走 tmux 默认行为；这里只是给它加 -F，预览窗格不受影响（预览是
# choose-tree 自己的 capture-pane 渲染，跳动的点照旧）。
# -F 必须用单引号：tmux 3.2a 的默认 format 里含三个双引号。
# 下面这一长串是「3.2a 默认 format」原样 + 在 pane 行和 window 行开头插入图标，
# 所以 pane 计数、#{window_flags}、活动 pane 的 *、marked 的 M、单 pane 窗口的
# : "title" 后缀、session 的 windows 计数 / (attached) 全部保留。
# 为什么粘两遍而不是 set -g @fmt '...' 存一次再 -F "#{@fmt}"：实测选项值里的
# 嵌套 #{} 不会被二次展开，引用出来是字面量 "IDX=#{window_index}"。
# session 行读的是 @ai_sess —— ai-status.sh 预先算好的「该会话内最严重状态」。
# 不能像 pane/window 行那样读 @ai_state：pane 作用域选项在 session 作用域只解析到
# 活动 pane，对「另一个窗口在等确认」的会话会报错状态；要在 format 里做对得每行
# 跑一次 #()，不值。
bind w choose-tree -Zw -F '#{?pane_format,#{?#{==:wait,#{@ai_state}},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{==:busy,#{@ai_state}},#[fg=#61afef]✦ #[default],#{?#{==:idle,#{@ai_state}},#[fg=#98c379]✓ #[default],}}}#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?#{==:wait,#{@ai_state}},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{==:busy,#{@ai_state}},#[fg=#61afef]✦ #[default],#{?#{==:idle,#{@ai_state}},#[fg=#98c379]✓ #[default],}}}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{?#{==:#{@ai_sess},wait},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{==:#{@ai_sess},busy},#[fg=#61afef]✦ #[default],#{?#{==:#{@ai_sess},idle},#[fg=#98c379]✓ #[default],}}}#{session_name}: #{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'
bind s choose-tree -Zs -F '#{?pane_format,#{?#{==:wait,#{@ai_state}},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{==:busy,#{@ai_state}},#[fg=#61afef]✦ #[default],#{?#{==:idle,#{@ai_state}},#[fg=#98c379]✓ #[default],}}}#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?#{==:wait,#{@ai_state}},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{==:busy,#{@ai_state}},#[fg=#61afef]✦ #[default],#{?#{==:idle,#{@ai_state}},#[fg=#98c379]✓ #[default],}}}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{?#{==:#{@ai_sess},wait},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{==:#{@ai_sess},busy},#[fg=#61afef]✦ #[default],#{?#{==:#{@ai_sess},idle},#[fg=#98c379]✓ #[default],}}}#{session_name}: #{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'

# --- prefix+a：跨所有会话找 AI 会话（fzf 模糊搜索 + 右侧实时预览）---
# 需要 fzf。满屏而不是弹窗：tmux 3.2a 的 display-popup 去不掉边框（-B 是 3.3 才有），
# 所以开一个 split-window -f 的临时 pane 再 resize-pane -Z 撑满，视觉上和
# choose-tree -Z 一致；fzf 退出后 pane 自然消亡，zoom 解除、原布局恢复。
# if-shell 先判空，免得开出一个空列表再关掉，闪一下很难看。
bind a if-shell '~/.config/tmux/scripts/ai-panes.sh | cut -f1 | grep -q .' \
  'split-window -f ~/.config/tmux/scripts/ai-pick.sh ; resize-pane -Z' \
  'display-message "没有正在运行的 AI 会话"'

# --- Popup：统一 OneDark 外框（tmux >= 3.3）---
# 3.2a 不支持 popup-border-lines/style；按服务端版本跳过，当前旧会话可安全重载。
# 新版 binary 装好后仍需重启 tmux server，服务端升级后四个 popup 会一起生效。
if-shell -F '#{>=:#{version},3.3}' 'set -g popup-border-lines rounded'
if-shell -F '#{>=:#{version},3.3}' 'set -g popup-style "bg=#21252b,fg=#abb2bf"'
if-shell -F '#{>=:#{version},3.3}' 'set -g popup-border-style "bg=#21252b,fg=#61afef"'

# --- prefix+c：浮窗选配置文件，nvim 打开 ---
# -E 让命令退出后浮窗自动消失；选中后 nvim 直接在浮窗里打开，退出 nvim 浮窗随之关闭。
# 85% 尺寸给 nvim 留足空间。小写 c 原本是 tmux 默认 new-window，
# 与 t（new-window）重复，腾给 config picker。
bind c display-popup -w 85% -h 85% -E '~/.config/tmux/scripts/config-pick.sh'

# --- 临时 popup 工具，不打乱当前 pane 布局 ---
bind f display-popup -w 80% -h 70% -E '~/.config/tmux/scripts/path-pick.sh'
# 显式恢复默认值，避免当前 server 重载后残留旧的 prefix+p 路径选择器绑定
bind p previous-window
bind y if-shell 'command -v yazi >/dev/null 2>&1' \
  'display-popup -w 90% -h 85% -d "#{pane_current_path}" -E yazi' \
  'display-message "yazi 未安装"'
# ? 原本是 tmux 快捷键列表，迁到 H；? 用于输入命令并查看精简用法
bind H list-keys
bind ? display-popup -w 80% -h 80% -E '~/.config/tmux/scripts/tldr-popup.sh'

setw -g pane-border-style "fg=#61afef"    # 分隔线统一蓝色
set -g pane-active-border-style "fg=#61afef,bold"   # 活动面板加粗区分

# --- nvim ↔ tmux 无缝导航（vim-tmux-navigator 原生绑定，不依赖 TPM）---
# 当前 pane 在跑 (n)vim 时把 Ctrl+hjkl 透传给 vim，否则切 tmux 面板
# 注：不绑 C-\（保留给 nvim toggleterm 开关 / shell 的 SIGQUIT）
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Plugins ---
# TPM 插件安装路径：配置放在 XDG 路径时 TPM 默认会用 ~/.config/tmux/plugins/，
# 与实际安装位置不一致会导致所有插件静默不加载，这里显式指定
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'

# tmux-jump：easymotion 式跳转（需 ruby）
# 两键序列入口：prefix + Space 进 jump 子表，再按 s 触发跳转；Esc 退出子表
# @jump-key 设为 M-j 只为避免插件默认绑定覆盖 prefix+j（选下方面板），装完在文件末尾 unbind 掉
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key M-j
bind Space switch-client -T jump
bind -T jump s run-shell -b "$HOME/.tmux/plugins/tmux-jump/scripts/tmux-jump.sh"
bind -T jump Escape switch-client -T root

run '~/.tmux/plugins/tpm/tpm'

# tmux-jump 加载后移除其默认的 prefix+M-j 绑定，只保留上面的 prefix+Space+s 入口
unbind M-j

# --- Prefix: Ctrl+z ---
unbind C-b
set -g prefix C-z
bind C-z send-prefix
