# Tmux Config — LostmanMing

# --- Clipboard Detection (run once at startup) ---
run-shell "if command -v pbcopy >/dev/null 2>&1; then tmux set -g @clipboard_cmd 'pbcopy'; elif command -v xclip >/dev/null 2>&1; then tmux set -g @clipboard_cmd 'xclip -selection clipboard'; elif command -v clip.exe >/dev/null 2>&1; then tmux set -g @clipboard_cmd 'clip.exe'; fi"

# --- Basic ---
set -g mouse on                    # 鼠标支持
set -s escape-time 0               # 按键响应更快
# set -g passthrough on              # 放行 sixel 等图形到终端（已注释，next-3.8 不支持）
set -g set-clipboard on              # tmux buffer 同步系统剪贴板
set -g focus-events on             # 焦点事件
set -g history-limit 10000         # 回滚行数
set -g base-index 1                # 窗口编号从 1 开始
setw -g pane-base-index 1          # 面板编号从 1 开始
set -g renumber-windows on         # 关闭窗口后重新编号
setw -g aggressive-resize on       # 多客户端连接时按"窗口"取最小尺寸，而非整个 session

# prefix + R 一键重载配置
bind R source-file ~/.config/tmux/tmux.conf \; display "配置已重载"

# --- True Color ---
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm*:Tc"

# --- Pane Navigation (vim-style) ---
bind h select-pane -L               # 左边面板
bind j select-pane -D               # 下面面板
bind k select-pane -U               # 上面面板
bind l select-pane -R               # 右边面板

# --- Splits (对齐 nvim: \ 垂直, - 水平) ---
bind \\ split-window -h -c "#{pane_current_path}"   # 垂直分屏
bind - split-window -v -c "#{pane_current_path}"    # 水平分屏

# --- Window Management ---
bind t new-window -c "#{pane_current_path}"   # 新建窗口（t=terminal）
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# --- Copy Mode (vi 风格) ---
setw -g mode-keys vi

bind Escape copy-mode                  # 进入复制模式
bind Enter copy-mode                   # 进入复制模式

# 退出复制模式
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi a send -X cancel
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi Enter send -X cancel

# vim 风格选择
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
# 复制时使用预检测的剪贴板命令（无运行时开销）
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@clipboard_cmd}"

# 粘贴
bind P paste-buffer
bind -T copy-mode-vi p paste-buffer \; send -X cancel

# --- Session ---
bind S command-prompt -p "Session name:" "new-session -s '%%'"   # 新建 session
bind N switch-client -n                 # 下一个 session
bind . command-prompt -I "#S" "rename-session '%%'"   # 重命名 session

# --- Status Bar ---
set -g status on
set -g status-justify centre
set -g status-left-length 30
set -g status-right-length 60
set -g status-interval 2         # AI 状态指示要够快；实测聚合脚本 ~6ms，2s 约占单核 0.3%/客户端
                                # 不降到 1：status-justify centre 下计数宽度一变，居中的窗口列表会抖

# 配色（AtomOneDark）：蓝 #61afef，背景 #21252b，灰 #abb2bf
set -g status-left "#[fg=#21252b,bold]#{?client_prefix,#[bg=#e5c07b] PREFIX ,#{?#{!=:#{client_key_table},root},#[bg=#e5c07b] #{client_key_table} ,#[bg=#61afef] #S }}#[default]"
# status-right：AI 状态汇总（所有 session）+ 时钟
# 聚合器输出形如 ⚑2 ✦1 ✓3，没有 AI pane 时输出空串（退回只有时钟的样子）。
# 放在时钟左边：时钟因此钉在最右，计数变宽时不会左右跳。
# 直接调脚本、不要写成 #(sh .../ai-status.sh)：本机 /bin/sh 是 dash，而脚本用了
# bash 数组，用 sh 调会直接语法错误退出、状态栏静默空白（踩过）。脚本入库为 100755。
set -g status-right "#(~/.config/tmux/scripts/ai-status.sh)#[bg=#3e4451,fg=#abb2bf] %H:%M "
set -g status-style "bg=#21252b,fg=#abb2bf"

setw -g window-status-separator " "
# 窗口名后缀追加 AI 状态图标：⚑黄=等你确认  ✦蓝=思考中  ✓绿=已完成
# （黄与 status-left 的 PREFIX 指示同色，但两者分处状态栏两端，不会混淆）
# 字形选择踩过两个坑，别乱换：
#   1. 三个都必须是 East Asian Width = N（中性）。原来用的 ◇ U+25C7 是 A（歧义宽），
#      CJK 字体常画成双宽，而 tmux 按 wcwidth 只预留一格 → 顶出矩形边缘。
#   2. 不要换成 ✔ U+2714「粗对勾」：它有 emoji 变体（✔️），很多字体走 emoji 字体
#      回退画成双宽，会把后面的字挡掉（实测）。✓ U+2713 无 emoji 变体，是纯文本字形。
# 图标后那一格空格必须在 #[default] 之前——它要继承矩形背景，给字形留收口缓冲。
# 放后缀而非前缀：上面两个 format 只设了 fg、没重置 bg/属性，前缀会把样式泄漏进窗口名；
# 后缀之后只有 window-status-separator，泄漏不可见。
# 条件内的样式必须拆成 #[fg=X]#[bold]——带逗号的 #[fg=X,bold] 会被格式引擎截断（实测）。
# 注意 #{pane_title} 在 window 作用域取的是**活动 pane**：分屏且 AI pane 非活动时这里不显示，
# 那种情况由 status-right 的全局计数兜住。
setw -g window-status-format "#[fg=#5c6370] #{window_index} #W#{?#{m:*| Action Required*,#{pane_title}}, #[fg=#e5c07b]#[bold]⚑,#{?#{m:*| Working*,#{pane_title}}, #[fg=#61afef]✦,#{?#{m:*| Ready*,#{pane_title}}, #[fg=#98c379]✓,}}} #[default]"
setw -g window-status-current-format "#[bg=#3e4451,fg=#61afef,bold] #{window_index} #[fg=#abb2bf]#W#{?#{m:*| Action Required*,#{pane_title}}, #[fg=#e5c07b]#[bold]⚑,#{?#{m:*| Working*,#{pane_title}}, #[fg=#61afef]✦,#{?#{m:*| Ready*,#{pane_title}}, #[fg=#98c379]✓,}}} #[default]"

# --- prefix+w / prefix+s 的会话·窗口选择器，行首带 AI 状态图标 ---
# 这两个键原来走 tmux 默认行为；这里只是给它加 -F，预览窗格不受影响（预览是
# choose-tree 自己的 capture-pane 渲染，跳动的点照旧）。
# -F 必须用单引号：tmux 3.2a 的默认 format 里含三个双引号。
# 下面这一长串是「3.2a 默认 format」原样 + 在 pane 行和 window 行开头插入图标，
# 所以 pane 计数、#{window_flags}、活动 pane 的 *、marked 的 M、单 pane 窗口的
# : "title" 后缀、session 的 windows 计数 / (attached) 全部保留。
# 为什么粘两遍而不是 set -g @fmt '...' 存一次再 -F "#{@fmt}"：实测选项值里的
# 嵌套 #{} 不会被二次展开，引用出来是字面量 "IDX=#{window_index}"。
# session 行故意不加图标：#{pane_title} 在 session 作用域只解析到活动 pane，
# 对「另一个窗口在等确认」的会话会报错状态；要做对得每行跑一次 #()，不值。
bind w choose-tree -Zw -F '#{?pane_format,#{?#{m:*| Action Required*,#{pane_title}},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{m:*| Working*,#{pane_title}},#[fg=#61afef]✦ #[default],#{?#{m:*| Ready*,#{pane_title}},#[fg=#98c379]✓ #[default],}}}#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?#{m:*| Action Required*,#{pane_title}},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{m:*| Working*,#{pane_title}},#[fg=#61afef]✦ #[default],#{?#{m:*| Ready*,#{pane_title}},#[fg=#98c379]✓ #[default],}}}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{?#{==:#{@ai_sess},wait},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{==:#{@ai_sess},busy},#[fg=#61afef]✦ #[default],#{?#{==:#{@ai_sess},idle},#[fg=#98c379]✓ #[default],}}}#{session_name}: #{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'
bind s choose-tree -Zs -F '#{?pane_format,#{?#{m:*| Action Required*,#{pane_title}},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{m:*| Working*,#{pane_title}},#[fg=#61afef]✦ #[default],#{?#{m:*| Ready*,#{pane_title}},#[fg=#98c379]✓ #[default],}}}#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?#{m:*| Action Required*,#{pane_title}},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{m:*| Working*,#{pane_title}},#[fg=#61afef]✦ #[default],#{?#{m:*| Ready*,#{pane_title}},#[fg=#98c379]✓ #[default],}}}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{?#{==:#{@ai_sess},wait},#[fg=#e5c07b]#[bold]⚑ #[default],#{?#{==:#{@ai_sess},busy},#[fg=#61afef]✦ #[default],#{?#{==:#{@ai_sess},idle},#[fg=#98c379]✓ #[default],}}}#{session_name}: #{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'

setw -g pane-border-style "fg=#61afef"    # 分隔线统一蓝色
set -g pane-active-border-style "fg=#61afef,bold"   # 活动面板加粗区分

# --- nvim ↔ tmux 无缝导航（vim-tmux-navigator 原生绑定，不依赖 TPM）---
# 当前 pane 在跑 (n)vim 时把 Ctrl+hjkl 透传给 vim，否则切 tmux 面板
# 注：不绑 C-\（保留给 nvim toggleterm 开关 / shell 的 SIGQUIT）
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# --- Plugins ---
# TPM 插件安装路径：配置放在 XDG 路径时 TPM 默认会用 ~/.config/tmux/plugins/，
# 与实际安装位置不一致会导致所有插件静默不加载，这里显式指定
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'

# tmux-thumbs：prefix + f 后屏幕上的词/路径/URL 标字母，按字母直接复制
# 需 cargo 构建：装完 prefix+I 后，在 ~/.tmux/plugins/tmux-thumbs 执行 cargo build --release
# 覆盖默认的 find-window（查窗口用得少，把 prefix+f 让给屏幕选词）
unbind f
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key f
# 复制到 tmux buffer；配合上面的 set-clipboard on 经 OSC52 同步系统剪贴板
set -g @thumbs-command 'tmux set-buffer -- {} && tmux display-message "已复制: {}"'

# tmux-jump：easymotion 式跳转（需 ruby）
# 两键序列入口：prefix + Space 进 jump 子表，再按 s 触发跳转；Esc 退出子表
# @jump-key 设为 M-j 只为避免插件默认绑定覆盖 prefix+j（选下方面板），装完在文件末尾 unbind 掉
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key M-j
bind Space switch-client -T jump
bind -T jump s run-shell -b "$HOME/.tmux/plugins/tmux-jump/scripts/tmux-jump.sh"
bind -T jump Escape switch-client -T root

run '~/.tmux/plugins/tpm/tpm'

# tmux-jump 加载后移除其默认的 prefix+M-j 绑定，只保留上面的 prefix+Space+s 入口
unbind M-j

# --- Prefix: Ctrl+z ---
unbind C-b
set -g prefix C-z
bind C-z send-prefix
